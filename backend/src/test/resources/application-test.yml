spring:
  application:
    name: maid-manager-backend-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

server:
  port: 0

app:
  default-timezone: Asia/Kolkata
  default-currency: INR
  security:
    jwt:
      access-secret: test-insecure-dev-access-secret-minimum-256-bits-for-local-testing!
      refresh-secret: test-insecure-dev-refresh-secret-minimum-256-bits-for-local-testing!
      access-ttl-seconds: 900
      refresh-ttl-seconds: 2592000
