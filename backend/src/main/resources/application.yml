spring:
  application:
    name: maid-manager-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/maid_manager}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  default-timezone: ${APP_DEFAULT_TIMEZONE:Asia/Kolkata}
  default-currency: ${APP_DEFAULT_CURRENCY:INR}
  security:
    jwt:
      access-secret: ${JWT_ACCESS_SECRET:default-insecure-dev-access-secret-minimum-256-bits-for-local-testing!}
      refresh-secret: ${JWT_REFRESH_SECRET:default-insecure-dev-refresh-secret-minimum-256-bits-for-local-testing!}
      access-ttl-seconds: ${JWT_ACCESS_TTL:900} # 15 minutes
      refresh-ttl-seconds: ${JWT_REFRESH_TTL:2592000} # 30 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,exp://*}
